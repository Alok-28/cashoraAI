<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CASHORA.TECH</title>
    <link href="https://framerusercontent.com/images/AxQMXkb9SNyxDMp63XvKlzyGFo.png" rel="icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            max-width: 220px;
            margin: 0 auto 40px;
        }
        
        .logo img {
            width: 100%;
            height: auto;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 50px;
            line-height: 1.5;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }
        
        .form-group {
            text-align: left;
        }
        
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .signin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            margin-top: 8px;
        }
        
        .signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .signin-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 16px;
            padding: 12px;
            background: #fef2f2;
            border-radius: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        #user-info {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 16px;
            margin-top: 20px;
        }
        
        #user-info.show {
            display: flex;
        }
        
        .user-avatar-container {
            position: relative;
        }
        
        #user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #667eea;
        }
        
        .user-details {
            text-align: center;
        }
        
        #user-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        #user-email {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        
        #logout-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        #logout-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        
        .success-message {
            color: #10b981;
            font-size: 15px;
            margin-top: 24px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .back-home {
            margin-top: 35px;
        }
        
        .back-home a {
            color: #667eea;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        
        .back-home a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://framerusercontent.com/images/ug8zZiGfm3VpXw3P4uz37Ask.png" alt="CASHORA.TECH">
        </div>
        
        <h1>Welcome Back</h1>
        <p>Sign in to access your account</p>
        
        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="signin-btn">Sign In</button>
        </form>
        
        <div class="error-message" id="error-message">
            Invalid email or password
        </div>
        
        <div id="user-info">
            <div class="user-avatar-container">
                <img id="user-avatar" src="" alt="avatar">
            </div>
            <div class="user-details">
                <div id="user-name"></div>
                <div id="user-email"></div>
                <a id="logout-btn" href="/auth/logout">Sign Out</a>
            </div>
        </div>
        
        <div class="success-message" id="success-message">
            ✓ Successfully signed in!
        </div>
        
        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>
    
    <script>
        // Check if user is already logged in
        fetch('/auth/user')
            .then(r => r.json())
            .then(data => {
                if (data.loggedIn) {
                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('user-info').classList.add('show');
                    document.getElementById('user-name').textContent = data.name;
                    document.getElementById('user-email').textContent = data.email;
                    document.getElementById('user-avatar').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.name) + '&background=667eea&color=fff&size=80';
                    document.getElementById('success-message').classList.add('show');
                }
            })
            .catch(() => {}); // server not running, silently fail
        
        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Redirect to dashboard after successful login
                    setTimeout(() => {
                        window.location.href = '../dashboard/';
                    }, 500);
                } else {
                    document.getElementById('error-message').textContent = data.message || 'Invalid email or password';
                    document.getElementById('error-message').classList.add('show');
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Server connection failed';
                document.getElementById('error-message').classList.add('show');
            }
        });
    </script>
</body>
</html>
